name: Build and Release

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build_and_release:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: |
          dotnet restore "./YouTube Metadata Extractor.csproj"
          dotnet build "./YouTube Metadata Extractor.csproj" -c Release --no-restore

      - name: Setup Node
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install semantic-release and plugins
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/github

      - name: Run semantic-release
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Read release version
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        id: relver
        run: |
          if [ -f .next-release-version ]; then
            version="$(cat .next-release-version)"
            printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          else
            printf 'version=\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG key for signing
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.relver.outputs.version != '' }}
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_config_global: true
          git_user_name: ${{ secrets.GPG_GIT_USER_NAME }}
          git_user_email: ${{ secrets.GPG_GIT_USER_EMAIL }}

      - name: Commit bump to release branch
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.relver.outputs.version != '' }}
        id: signed_commit
        run: |
          branch="release/${{ steps.relver.outputs.version }}"
          git switch -C "$branch"
          git add CHANGELOG.md "./YouTube Metadata Extractor.csproj"

          if git diff --cached --quiet; then
            printf 'skip=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -S -m "chore(release): ${{ steps.relver.outputs.version }}"
          git push --force-with-lease origin "HEAD:$branch"
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"

      - name: Create or find release PR
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.relver.outputs.version != '' && steps.signed_commit.outputs.skip != 'true' }}
        id: pr
        env:
          GH_TOKEN: ${{ secrets.AUTO_APPROVE_TOKEN }}
        run: |
          branch="${{ steps.signed_commit.outputs.branch }}"

          pr_number="$(gh pr list --head "$branch" --base "${{ github.ref_name }}" --json number --jq '.[0].number // empty')"

          if [ -z "$pr_number" ]; then
            gh pr create \
              --base "${{ github.ref_name }}" \
              --head "$branch" \
              --title "chore(release): ${{ steps.relver.outputs.version }}" \
              --body "Autogenerated changelog and version bump for ${{ steps.relver.outputs.version }}."

            pr_number="$(gh pr list --head "$branch" --base "${{ github.ref_name }}" --json number --jq '.[0].number // empty')"
          fi

          if [ -z "$pr_number" ]; then
            echo "Failed to determine release PR number." >&2
            exit 1
          fi

          printf 'number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"

      - name: Auto-approve release PR
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.pr.outputs.number != '' }}
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.pr.outputs.number }}

      - name: Enable auto-merge for release PR
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.pr.outputs.number != '' }}
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.pr.outputs.number }}
          merge-method: squash

  seed_release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prepare tagged release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash ./scripts/prepare-release.sh "$version"

      - name: Create or update seeded GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" publish/release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" publish/release-assets/* --generate-notes
          fi
